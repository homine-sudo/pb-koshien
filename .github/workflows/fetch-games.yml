name: 試合結果の取得

on:
  # 時刻はUTC。日本時間 −9時間。試合があるのは日本時間 8:00〜21:00ごろ。
  #
  # ⚠ 分を 0 と 30 にしないこと。
  #   GitHubの定期実行は、みんなが指定する時刻ほど混んで遅れる・飛ぶ。
  #   0分と30分がいちばん混む。実際 2026-08-07 は 0/30分指定で
  #   10:40→16:28、19:03→21:49 と2回、数時間まるごと飛んだ（間隔ではなく混雑が原因）。
  #   そこで半端な分にずらし、あわせて15分おきにして1回飛んでも痛くないようにした。
  #
  # それでも飛ぶことはある。遅れているかどうかは
  # アプリ上部のバーの「取得 8/7 21:50」で分かる。
  # 急ぐときは Actions →「試合結果の取得」→ Run workflow で手動実行。
  schedule:
    - cron: '8,23,38,53 22,23 * * *'    # 日本時間 7時台・8時台
    - cron: '8,23,38,53 0-14 * * *'     # 日本時間 9時台〜23時台
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-games
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: fetch
        run: node scripts/fetch_games.js
      - name: commit
        run: |
          git config user.name  "koshien-bot"
          git config user.email "koshien-bot@users.noreply.github.com"
          if [ -n "$(git status --porcelain data/games.json)" ]; then
            git add data/games.json
            git commit -m "update games"
            git push
          else
            echo "no change"
          fi
